version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: partyhub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: partyhub
      POSTGRES_USER: partyhub
      POSTGRES_PASSWORD: sua_senha_aqui
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: